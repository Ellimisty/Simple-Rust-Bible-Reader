[workspace]
resolver = "2"
members = [
    "crates/sbr-xml",
    "crates/sbr-rtf",
    "crates/sbr-sword",
    "crates/sbr-core",
    "crates/sbr-cli",
]

[workspace.package]
version = "5.6.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/Ellimisty/Simple-Rust-Bible-Reader"

[workspace.dependencies]
sbr-xml = { path = "crates/sbr-xml" }
sbr-core = { path = "crates/sbr-core" }
sbr-rtf = { path = "crates/sbr-rtf" }
sbr-sword = { path = "crates/sbr-sword" }
fancy-regex = "0.14"
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
encoding_rs = "0.8"
thiserror = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
