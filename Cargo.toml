[workspace]
resolver = "2"
members = ["crates/sbr-xml", "crates/sbr-core"]

[workspace.package]
version = "5.6.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/Ellimisty/Simple-Rust-Bible-Reader"

[workspace.dependencies]
sbr-xml = { path = "crates/sbr-xml" }
sbr-core = { path = "crates/sbr-core" }
fancy-regex = "0.14"
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
encoding_rs = "0.8"
thiserror = "1"
